<div class="card">
  <div class="card-header bg-white p-1">
    <div class="d-flex gap-1">
      <button
        class="btn-add"
        nz-button
        nzType="default"
        nzSize="small"
        (click)="onAddUnit(false)"
      >
        Thêm
      </button>
      <button
        class="btn-edit"
        nz-button
        nzType="default"
        nzSize="small"
        (click)="onAddUnit(true)"
      >
        Sửa
      </button>
         <button
          class="btn-delete"
          nz-button
          nzType="default"
          nzSize="small"
          (click)="onDeleteProduct()"
        >
          <img src="assets/icon/action_delete_item_16.png" /> Xóa
        </button>
    </div>
  </div>

  <div class="grid-master-container">
    <angular-slickgrid
      gridId="unitGrid"
      [columns]="columnUnit"
      [options]="gridOptionUnit"
      [dataset]="datasetUnit"
      (angularGridReady)="gridUnitReady($event)"
      (onActiveCellChanged)="onActiveCellChanged($event)"
      (selectedRowsChanged)="onSelectedRowsChanged($event)"
    >
    </angular-slickgrid>
  </div>
</div>

<ng-template #unitFormTpl>
  <form nz-form [formGroup]="formGroup">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
            <nz-form-item>
          <nz-form-label for="CodeInput" class="form-label p-0"
            >Mã đơn vị<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Code')?.hasError('required') &&
              (formGroup.get('Code')?.dirty || formGroup.get('Code')?.touched)
                ? 'Vui lòng nhập mã lỗi hỏng hóc!'
                : formGroup.get('Code')?.hasError('maxlength')
                ? 'Mã đơn vị tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="CodeInput"
              nz-input
              name="Code"
              placeholder="Nhập tên mã đơn vị"
              formControlName="Code"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên đơn vị<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Name')?.hasError('required') &&
              (formGroup.get('Name')?.dirty || formGroup.get('Name')?.touched)
                ? 'Vui lòng nhập tên đơn vị!'
                : formGroup.get('Name')?.hasError('maxlength')
                ? 'Tên đơn vị tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="Name"
              placeholder="Nhập tên đơn vị"
              formControlName="Name"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>

    <div class="d-flex justify-content-end gap-1">
      <button nz-button nzType="default" type="button" (click)="onCancelUnit($event)">Hủy</button>
      <button nz-button nzType="primary" type="button" (click)="saveIssuesData()">Lưu</button>
    </div>
  </form>
</ng-template>
