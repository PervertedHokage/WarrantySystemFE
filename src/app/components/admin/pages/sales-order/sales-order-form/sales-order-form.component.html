<div class="modal-body">
  <form nz-form [formGroup]="formGroup" nzLayout="vertical" class="fs-7 mt-2">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên khách hàng<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerName')?.hasError('required') &&
              (formGroup.get('CustomerName')?.dirty || formGroup.get('CustomerName')?.touched)
                ? 'Vui lòng nhập tên khách hàng!'
                : formGroup.get('CustomerName')?.hasError('maxlength')
                ? 'Tên khách hàng tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="CustomerName"
              placeholder="Nhập tên khách hàng"
              formControlName="CustomerName"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="CodeInput" class="form-label p-0"
            >SO Code<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Code')?.hasError('required') &&
              (formGroup.get('Code')?.dirty || formGroup.get('Code')?.touched)
                ? 'Vui lòng nhập SO Code!'
                : formGroup.get('Code')?.hasError('maxlength')
                ? 'SO Code tối đa 20 ký tự!'
                : undefined
            "
          >
            <input
              id="CodeInput"
              nz-input
              name="Code"
              placeholder="Nhập SO Code"
              formControlName="Code"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row [nzGutter]="16">
          <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
                <nz-form-item>
          <nz-form-label for="CustomerPhoneNumberInput" class="form-label p-0"
            >Số điện thoại<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerPhoneNumber')?.hasError('required') &&
              (formGroup.get('CustomerPhoneNumber')?.dirty || formGroup.get('CustomerPhoneNumber')?.touched)
                ? 'Vui lòng nhập số điện thoại!'
                : formGroup.get('CustomerPhoneNumber')?.hasError('maxlength')
                ? 'Số điện thoại tối đa 20 ký tự!'
                : undefined
            "
          >
            <input
              id="CustomerPhoneNumberInput"
              nz-input
              name="CustomerPhoneNumber"
              placeholder="Nhập số điện thoại"
              formControlName="CustomerPhoneNumber"
            />
          </nz-form-control>
        </nz-form-item>
        </nz-col>
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
                <nz-form-item>
          <nz-form-label for="CustomerAddressInput" class="form-label p-0"
            >Địa chỉ<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerAddress')?.hasError('required') &&
              (formGroup.get('CustomerAddress')?.dirty || formGroup.get('CustomerAddress')?.touched)
                ? 'Vui lòng nhập địa chỉ!'
                : formGroup.get('Name')?.hasError('maxlength')
                ? 'Địa chỉ tối đa 100 ký tự!'
                : undefined
            "
          >
            <input
              id="CustomerAddressInput"
              nz-input
              name="CustomerAddress"
              placeholder="Nhập địa chỉ"
              formControlName="CustomerAddress"
            />
          </nz-form-control>
        </nz-form-item>
        </nz-col>
    </nz-row>
  </form>
  <div class="table-container">
    <div #OrderTable></div>
  </div>

</div>
  <div class="modal-footer mt-3 gap-3">
      <button nz-button nzDanger nzType="default" (click)="close()">
        Đóng
      </button>
      <button nz-button nzType="primary" (click)="saveSaleOrderData()">
        Lưu
      </button>
    </div>
