<div class="card">
  <div class="card-header bg-white p-1">
    <div class="d-flex gap-1">
      <button
        class="btn-edit"
        nz-button
        nzType="default"
        nzSize="small"
        (click)="onAddCustomer(true)"
      >
        <img src="assets/icon/action_edit_item_16.png" /> Sửa
      </button>
      <button
        class="btn-delete"
        nz-button
        nzType="default"
        nzSize="small"
        (click)="onDeleteCustomer()"
        
      >
        <img src="assets/icon/action_delete_item_16.png" /> Xóa
      </button>
    </div>
  </div>
  <div class="grid-customer-container">
    <angular-slickgrid
      gridId="customerGrid"
      [columns]="columnCustomer"
      [options]="gridOptionCustomer"
      [dataset]="datasetCustomer"
      (onAngularGridCreated)="gridReady($event)"  
      (onActiveCellChanged)="onActiveCellChanged($event)"
      (selectedRowsChanged)="onSelectedRowsChanged($event)"
    >
    </angular-slickgrid>
  </div>
</div>

<ng-template #unitFormTpl>
  <form nz-form [formGroup]="formGroup" nzLayout="vertical">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên khách hàng<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerName')?.hasError('required') &&
              (formGroup.get('CustomerName')?.dirty || formGroup.get('CustomerName')?.touched)
                ? 'Vui lòng nhập tên khách hàng!'
                : formGroup.get('CustomerName')?.hasError('maxlength')
                ? 'Tên khách hàng tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="CustomerName"
              placeholder="Nhập tên khách hàng"
              formControlName="CustomerName"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="EmailInput" class="form-label p-0"
            >Email<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerEmail')?.hasError('required') &&
              (formGroup.get('CustomerEmail')?.dirty || formGroup.get('CustomerEmail')?.touched)
                ? 'Vui lòng nhập email!'
                : formGroup.get('CustomerEmail')?.hasError('maxlength')
                ? 'Email tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="EmailInput"
              nz-input
              name="CustomerEmail"
              placeholder="Nhập email"
              formControlName="CustomerEmail"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
       <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="PhoneNumberInput" class="form-label p-0"
            >Số điện thoại<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerPhoneNumber')?.hasError('required') &&
              (formGroup.get('CustomerPhoneNumber')?.dirty || formGroup.get('CustomerPhoneNumber')?.touched)
                ? 'Vui lòng nhập số điện thoại!'
                : formGroup.get('CustomerPhoneNumber')?.hasError('maxlength')
                ? 'Số điện thoại tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="PhoneNumberInput"
              nz-input
              name="CustomerPhoneNumber"
              placeholder="Nhập số điện thoại"
              formControlName="CustomerPhoneNumber"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="AddressInput" class="form-label p-0"
            >Địa chỉ<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('CustomerAddress')?.hasError('required') &&
              (formGroup.get('CustomerAddress')?.dirty || formGroup.get('CustomerAddress')?.touched)
                ? 'Vui lòng nhập địa chỉ!'
                : formGroup.get('CustomerAddress')?.hasError('maxlength')
                ? 'Địa chỉ tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="AddressInput"
              nz-input
              name="CustomerAddress"
              placeholder="Nhập địa chỉ"
              formControlName="CustomerAddress"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <div class="d-flex justify-content-end gap-1">
      <button nz-button nzType="default" type="button" (click)="onCancelUnit($event)">Hủy</button>
      <button nz-button nzType="primary" type="button" (click)="saveData()">Lưu</button>
    </div>
  </form>
</ng-template>
