<div class="modal-body">
  <form nz-form [formGroup]="formGroup" nzLayout="vertical" class="fs-7 mt-2">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="codeInput" class="form-label p-0"
            >Mã sản phẩm<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Code')?.hasError('required') &&
              (formGroup.get('Code')?.dirty || formGroup.get('Code')?.touched)
                ? 'Vui lòng nhập mã sản phầm!'
                : formGroup.get('Code')?.hasError('maxlength')
                ? 'Mã sản phẩm tối đa 20 ký tự!'
                : undefined
            "
          >
            <input
              id="codeInput"
              nz-input
              name="Code"
              placeholder="Nhập mã sản phẩm"
              formControlName="Code"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên sản phẩm<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Name')?.hasError('required') &&
              (formGroup.get('Name')?.dirty || formGroup.get('Name')?.touched)
                ? 'Vui lòng nhập tên sản phẩm!'
                : formGroup.get('Name')?.hasError('maxlength')
                ? 'Tên loại tối đa 100 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="Name"
              placeholder="Nhập tên sản phẩm"
              formControlName="Name"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row>
      <nz-col [nzSpan]="24">
        <nz-form-item>
          <nz-form-label for="DescriptionText" class="form-label p-0"
            >Mô tả</nz-form-label
          >
          <nz-form-control [nzSpan]="24">
            <textarea
              id="DescriptionText"
              nz-input
              name="Description"
              placeholder="Nhập mô tả sản phẩm"
              formControlName="Description"
            ></textarea>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
  </form>
      <div class="card-body hcns-table-wrapper" style="height: 100%;">
        <div class="hcns-table-container">
          <table class="hcns-table">
            <thead>
              <tr>
                <th
                  colspan="5"
                  style="text-align: center; border-bottom: 1px solid #d9d9d9"
                >
                  LINH KIỆN &amp; MÔ TẢ
                </th>
              </tr>
              <tr>
                <th style="width: 80px; text-align: center;">
                  <span
                    class="text-success cursor-pointer"
                    (click)="addPartGroup()"
                    title="Thêm linh kiện"
                  >+</span>
                </th>
                <th>Tên linh kiện</th>
                <th>Mã linh kiện mô tả</th>
                <th>Mô tả</th>
                <th>Đơn vị tính</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let part of partGroups">
                <ng-container
                  *ngFor="
                    let detail of part.Details || [];
                    let detailIndex = index
                  "
                >
                  <tr>
                    <!-- Cột action: chỉ hiển thị ở dòng đầu tiên của mỗi linh kiện -->
                    <td
                      *ngIf="detailIndex === 0"
                      [attr.rowspan]="(part.Details || []).length || 1"
                      style="text-align: center;"
                    >
                      <span
                        class="text-danger cursor-pointer delete-btn"
                        title="Xóa linh kiện"
                        (click)="removePartGroup(part.rowID)"
                      >x</span>
                    </td>

                    <!-- Tên linh kiện: chỉ hiển thị ở dòng đầu tiên, rowspan theo số dòng con -->
                    <td
                      *ngIf="detailIndex === 0"
                      [attr.rowspan]="(part.Details || []).length || 1"
                    >
                      <input
                        type="text"
                        placeholder="Nhập tên linh kiện"
                        [(ngModel)]="part.Name"
                      />
                    </td>

                    <!-- Mã linh kiện mô tả + nút thêm/xóa dòng con -->
                    <td>
                      <div>
                        <input
                          type="text"
                          placeholder="Nhập mã linh kiện mô tả"
                          [(ngModel)]="detail.SparePartNumber"
                        />
                        <div>
                          <span
                            class="text-success cursor-pointer me-1"
                            title="Thêm dòng mô tả"
                            (click)="addDetailRow(part.rowID)"
                          >+</span>
                          <span
                            class="text-danger cursor-pointer delete-btn"
                            title="Xóa dòng mô tả"
                            (click)="removeDetailRow(part.rowID, detailIndex)"
                          >x</span>
                        </div>
                      </div>
                    </td>

                    <!-- Mô tả linh kiện -->
                    <td>
                      <textarea
                        rows="2"
                        placeholder="Mô tả linh kiện"
                        [(ngModel)]="detail.Description"
                      ></textarea>
                    </td>

                    <!-- Đơn vị tính -->
                    <td>
                      <input
                        type="text"
                        placeholder="Đơn vị tính"
                        [(ngModel)]="detail.Unit"
                      />
                    </td>
                  </tr>
                </ng-container>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
</div>

    <div class="modal-footer mt-3 gap-3">
      <button nz-button nzDanger nzType="default" (click)="close()">
        Đóng
      </button>
      <button nz-button nzType="primary" (click)="saveProductData()">
        Lưu
      </button>
    </div>
