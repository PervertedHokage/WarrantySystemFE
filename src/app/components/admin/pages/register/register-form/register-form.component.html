<div class="modal-body">
  <form nz-form [formGroup]="formGroup" nzLayout="vertical" class="fs-7 mt-2">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
            <nz-form-item>
          <nz-form-label for="CodeInput" class="form-label p-0"
            >Mã nhân viên<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Code')?.hasError('required') &&
              (formGroup.get('Code')?.dirty || formGroup.get('Code')?.touched)
                ? 'Vui lòng nhập mã nhân viên!'
                : formGroup.get('Code')?.hasError('maxlength')
                ? 'Mã lỗi tối đa 20 ký tự!'
                : undefined
            "
          >
            <input
              id="CodeInput"
              nz-input
              name="Code"
              placeholder="Nhập mã nhân viên"
              formControlName="Code"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên nhân viên<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('FullName')?.hasError('required') &&
              (formGroup.get('FullName')?.dirty || formGroup.get('FullName')?.touched)
                ? 'Vui lòng nhập tên nhân viên!'
                : formGroup.get('Name')?.hasError('maxlength')
                ? 'Tên loại tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="FullName"
              placeholder="Nhập tên nhân viên"
              formControlName="FullName"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
            <nz-form-item>
          <nz-form-label for="EmailInput" class="form-label p-0"
            >Email<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Email')?.hasError('required') &&
              (formGroup.get('Email')?.dirty || formGroup.get('Email')?.touched)
                ? 'Vui lòng nhập email!'
                : formGroup.get('Email')?.hasError('email')
                ? 'Email không đúng định dạng!'
                : formGroup.get('Email')?.hasError('maxlength')
                ? 'Email tối đa 100 ký tự!'
                : undefined
            "
          >
            <input
              id="EmailInput"
              nz-input
              name="Email"
              placeholder="Nhập email"
              formControlName="Email"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="phoneInput" class="form-label p-0"
            >Số điện thoại<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Telephone')?.hasError('required') &&
              (formGroup.get('Telephone')?.dirty || formGroup.get('Telephone')?.touched)
                ? 'Vui lòng nhập số điện thoại!'
                : formGroup.get('Telephone')?.hasError('pattern')
                ? 'Số điện thoại không đúng định dạng!'
                : formGroup.get('Telephone')?.hasError('minlength')
                ? 'Số điện thoại tối thiểu 10 số!'
                : formGroup.get('Telephone')?.hasError('maxlength')
                ? 'Số điện thoại tối đa 11 số!'
                : undefined
            "
          >
            <input
              id="phoneInput"
              nz-input
              name="Telephone"
              placeholder="Nhập số điện thoại"
              formControlName="Telephone"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
            <nz-form-item>
          <nz-form-label for="LoginInput" class="form-label p-0"
            >Tên đăng nhập<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('LoginName')?.hasError('required') &&
              (formGroup.get('LoginName')?.dirty || formGroup.get('LoginName')?.touched)
                ? 'Vui lòng nhập tên đăng nhập!'
                : formGroup.get('LoginName')?.hasError('maxlength')
                ? 'Mã lỗi tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="LoginInput"
              nz-input
              name="LoginName"
              placeholder="Nhập tên đăng nhập"
              formControlName="LoginName"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="12">
        <nz-form-item>
          <nz-form-label for="passwordInput" class="form-label p-0"
            >Mật khẩu<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('PasswordHash')?.hasError('required') &&
              (formGroup.get('PasswordHash')?.dirty || formGroup.get('PasswordHash')?.touched)
                ? 'Vui lòng nhập mật khẩu!'
                : formGroup.get('PasswordHash')?.hasError('maxlength')
                ? 'Tên loại tối đa 50 ký tự!'
                : undefined
            "
          >
            <div style="position: relative;">
              <input
                id="passwordInput"
                nz-input
                [type]="passwordVisible ? 'text' : 'password'"
                name="PasswordHash"
                placeholder="Nhập mật khẩu"
                formControlName="PasswordHash"
                style="padding-right: 40px;"
              />
              <span 
                nz-icon 
                [nzType]="passwordVisible ? 'eye-invisible' : 'eye'" 
                (click)="passwordVisible = !passwordVisible" 
                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;"
                [class.password-hidden]="!passwordVisible"
              ></span>
              <style>
                .password-hidden::after {
                  content: '';
                  position: absolute;
                  top: 50%;
                  left: 0;
                  width: 100%;
                  height: 2px;
                  background: #666;
                  transform: translateY(-50%) rotate(-45deg);
                }
              </style>
            </div>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
        <nz-form-item>
          <nz-form-control [nzSpan]="24">
            <label nz-checkbox formControlName="IsAdmin">
              Admin
            </label>
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
    </nz-row>
  </form>
  <div class="table-container">
    <div #IssuesTable></div>
  </div>

</div>
  <div class="modal-footer mt-3 gap-3">
      <button nz-button nzDanger nzType="default" (click)="close()">
        Đóng
      </button>
      <button nz-button nzType="primary" (click)="saveData()">
        Lưu
      </button>
    </div>
