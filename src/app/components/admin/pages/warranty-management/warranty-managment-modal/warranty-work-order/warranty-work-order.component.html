<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0">
    <div class="card-header bg-white p-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="d-flex gap-1">
          <button
            class="btn-add"
            nz-button
            nzType="default"
            nzSize="small"
            (click)="onAddWorkOrder(false)"
          >
            <img src="assets/icon/action_add_item_16.png" /> Thêm
          </button>
          <button
            class="btn-edit"
            nz-button
            nzType="default"
            nzSize="small"
            (click)="onAddWorkOrder(true)"
          >
            <img src="assets/icon/action_edit_item_16.png" /> Sửa
          </button>
          <button
            class="btn-delete"
            nz-button
            nzType="default"
            nzSize="small"
            (click)="onDeleteMultipleWorkOrders()"
          >
            <img src="assets/icon/action_delete_item_16.png" /> Xóa
          </button>
        </div>
      </div>
    </div>
    <div id="warranty_work_order_grid_container">
      <angular-slickgrid
        gridId="warrantyWorkOrderGrid"
        [columns]="columnWorkOrder"
        [options]="gridOptionsWorkOrder"
        [dataset]="datasetWorkOrder"
        (onAngularGridCreated)="gridReady($event)"
        (onActiveCellChanged)="onActiveCellChanged($event)"
        (selectedRowsChanged)="onSelectedRowsChanged($event)"
        (onDblClick)="onAddWorkOrder(true)"
      >
      </angular-slickgrid>
    </div>
  </div>
</ng-container>
