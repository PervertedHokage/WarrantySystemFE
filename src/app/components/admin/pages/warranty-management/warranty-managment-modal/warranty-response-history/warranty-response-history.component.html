<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0">
    <div class="card-header bg-white p-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="d-flex gap-2">
          <button class="fs-12" nz-button nzType="default" nzSize="small" (click)="showFilter = !showFilter"
            alt="Lọc dữ liệu">
            <nz-icon [nzType]="showFilter ? 'up' : 'down'" nzTheme="outline" />
          </button>
          <button class="fs-12 btn-add" nz-button nzType="default" nzSize="small" (click)="openAddModal()">
            <img src="assets/icon/action_add_item_16.png" alt="Thêm" /> Thêm
          </button>
          <button class="fs-12 btn-edit" nz-button nzType="default" nzSize="small" (click)="openEditModal()">
            <img src="assets/icon/action_edit_item_16.png" alt="Sửa" />Sửa
          </button>
          <button class="fs-12 btn-delete" nz-button nzType="default" nzSize="small" (click)="onDelete()">
            <img src="assets/icon/action_delete_item_16.png" alt="Xóa" />Xóa
          </button>
        </div>
      </div>
      <div class="filter-wrapper" [class.open]="showFilter">
        <div class="d-flex flex-column gap-2 filter-content">
          <!-- Filters -->
          <div class="d-flex flex-wrap gap-3 align-items-center">
            <!-- Date range -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Từ ngày:</label>
              <nz-date-picker class="fs-12 filter-input" nzSize="small" [(ngModel)]="filter.fromDate"></nz-date-picker>
            </div>

            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Đến ngày:</label>
              <nz-date-picker class="fs-12 filter-input" nzSize="small" [(ngModel)]="filter.toDate"></nz-date-picker>
            </div>
          </div>

          <!-- Actions -->
          <div class="d-flex gap-2 justify-content-start">
            <button class="btn-apply-filter" nz-button nzType="primary" nzSize="small" (click)="applyFilter()">
              🔍 Lọc
            </button>
            <button class="btn-reset-filter" nz-button nzType="default" nzSize="small" (click)="resetFilter()">
              ❌ Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="grid_warranty_response_history_container" class="tab-container">
      <div class="tab-content">
        <angular-slickgrid #asg [gridId]="gridId" [columns]="columnDefinitions" [options]="gridOptions"
          [dataset]="dataset" (onAngularGridCreated)="angularGridReady($event.detail)" (onDblClick)="openEditModal()">
        </angular-slickgrid>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <nz-modal [(nzVisible)]="isModalVisible" [nzTitle]="modalTitle" (nzOnCancel)="handleModalCancel()"
    (nzOnOk)="handleModalOk()" nzWidth="700px">
    <ng-container *nzModalContent>
      <form class="d-flex flex-column gap-3">
        <div class="row">
          <div class="col-md-12">
            <label class="fs-12 fw-bold mb-1">Ngày phản hồi <span class="text-danger">*</span></label>
            <nz-date-picker class="w-100" [(ngModel)]="formData.ResponseDate" name="responseDate"
              nzFormat="yyyy-MM-dd"></nz-date-picker>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12">
            <label class="fs-12 fw-bold mb-1">Khách hàng <span class="text-danger">*</span></label>
            <nz-select nzShowSearch nzAllowClear placeholder="Chọn khách hàng" [(ngModel)]="formData.CustomerId"
              name="customerId" (ngModelChange)="onCustomerChange($event)" class="w-100">
              <nz-option *ngFor="let customer of customerList" [nzLabel]="customer.CustomerName"
                [nzValue]="customer.Id"></nz-option>
            </nz-select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <label class="fs-12 fw-bold mb-1">Người xử lý</label>
            <nz-select nzShowSearch nzAllowClear placeholder="Chọn người xử lý" [(ngModel)]="formData.ReceptionWorkerId"
              name="receptionWorkerId" (ngModelChange)="onUserChange($event)" class="w-100">
              <nz-option *ngFor="let user of userList" [nzLabel]="user.FullName" [nzValue]="user.Id"></nz-option>
            </nz-select>
          </div>
          <div class="col-md-6">
            <label class="fs-12 fw-bold mb-1">Trạng thái</label>
            <nz-select class="w-100" [(ngModel)]="formData.Status" name="status" placeholder="Chọn trạng thái">
              <nz-option [nzValue]="1" nzLabel="Chờ xử lý"></nz-option>
              <nz-option [nzValue]="2" nzLabel="Đang xử lý"></nz-option>
              <nz-option [nzValue]="3" nzLabel="Đã giải quyết"></nz-option>
              <nz-option [nzValue]="4" nzLabel="Đã đóng"></nz-option>
            </nz-select>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12">
            <label class="fs-12 fw-bold mb-1">Nội dung phản hồi <span class="text-danger">*</span></label>
            <textarea nz-input [(ngModel)]="formData.ResponseContent" name="responseContent"
              placeholder="Nhập nội dung phản hồi" rows="3"></textarea>
          </div>
        </div>

        <div class="row">
          <div class="col-md-12">
            <label class="fs-12 fw-bold mb-1">Ghi chú</label>
            <textarea nz-input [(ngModel)]="formData.Note" name="note" placeholder="Nhập ghi chú" rows="2"></textarea>
          </div>
        </div>
      </form>
    </ng-container>
  </nz-modal>
</ng-container>
