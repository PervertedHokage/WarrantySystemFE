<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0">
    <div class="card-header bg-white p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2">
          <button class="fs-12 btn-add" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small" (click)="openAddModal()">
            <img src="assets/icon/action_add_item_16.png" alt="Thêm " /> Thêm
          </button>
          <button class="fs-12 btn-edit" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small" (click)="openEditModal()">
            <img src="assets/icon/action_edit_item_16.png" alt="Sửa" />Sửa
          </button>
          <button class="fs-12 btn-delete" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small" (click)="openDeleteModal()">
            <img src="assets/icon/action_delete_item_16.png" alt="Xóa " />Xóa
          </button>
        </div>
        <!-- <div class="d-flex gap-2">
        <nz-input-group nzPrefixIcon="search" nzSize="small">
          <input type="text" nz-input placeholder="Tìm kiếm..." (input)="onSearch($event)" />
        </nz-input-group>
      </div> -->
      </div>
    </div>

    <div #tb_organization></div>
  </div>
</ng-container>

<nz-modal [(nzVisible)]="isVisible" [nzTitle]="isEditMode ? 'SỬA PHÒNG BAN' : 'THÊM PHÒNG BAN MỚI'" [nzOkText]="'Lưu'"
  [nzCancelText]="'Đóng'" [nzOkLoading]="isSubmitting" (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="organizationForm">
      <nz-form-item class="mb-1">
        <nz-form-label [nzSpan]="24">Cha </nz-form-label>
        <nz-form-control [nzSpan]="24" nzErrorTip="Vui lòng nhập mã phòng ban">
          <nz-tree-select [nzNodes]="lstOrganization" nzShowSearch nzPlaceHolder="Please select"
            formControlName="ParentId"></nz-tree-select>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item class="mb-1">
        <nz-form-label [nzSpan]="24">Mã phòng ban<span class="text-danger ps-1"> *</span></nz-form-label>
        <nz-form-control [nzSpan]="24" nzErrorTip="Vui lòng nhập mã phòng ban">
          <input nz-input formControlName="OrganizationCode" placeholder="Nhập mã phòng ban" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="mb-1">
        <nz-form-label [nzSpan]="24">Tên phòng ban <span class="text-danger ps-1"> *</span></nz-form-label>
        <nz-form-control [nzSpan]="24" nzErrorTip="Vui lòng nhập tên phòng ban">
          <input nz-input formControlName="OrganizationName" placeholder="Nhập tên phòng ban" />
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
