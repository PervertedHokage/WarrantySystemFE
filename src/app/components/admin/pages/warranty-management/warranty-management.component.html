<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0">
    <div class="card-header bg-white p-2">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="d-flex gap-2">
          <button class="fs-12" nz-button nzType="default" nzSize="small" (click)="showFilter = !showFilter"
            alt="Lọc dữ liệu">
            <nz-icon [nzType]="showFilter ? 'up' : 'down'" nzTheme="outline" />
          </button>
          <button class="fs-12 btn-add" nz-button nzType="default" nzSize="small" (click)="openAddModal()">
            <img src="assets/icon/action_add_item_16.png" alt="Thêm" /> Thêm
          </button>
          <button class="fs-12 btn-edit" nz-button nzType="default" nzSize="small" (click)="openEditModal()">
            <img src="assets/icon/action_edit_item_16.png" alt="Sửa" />Sửa
          </button>
          <button class="fs-12 btn-delete" nz-button nzType="default" nzSize="small" (click)="onDelete()">
            <img src="assets/icon/action_delete_item_16.png" alt="Xóa" />Xóa
          </button>
          <button class="fs-12" nz-button nzType="default" nzSize="small" (click)="onImportExcel()">
            <img src="assets/icon/action_import_excel_24.svg" width="16" height="16" alt="Import" /> Nhập Excel
          </button>
          <button class="fs-12" nz-button nzType="default" nzSize="small" (click)="onExportExcel()">
            <img src="assets/icon/action_export_excel_24.svg" width="16" height="16" alt="Export" /> Xuất Excel
          </button>
        </div>
      </div>
      <div class="filter-wrapper" [class.open]="showFilter">
        <div class="d-flex flex-column gap-2 filter-content">

          <!-- Filters -->
          <div class="d-flex flex-wrap gap-3 align-items-center">

            <!-- Status -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Trạng thái:</label>
              <nz-select class="fs-12 filter-input" nzSize="small" [(ngModel)]="filter.status">
                <nz-option [nzValue]="0" nzLabel="Tất cả"></nz-option>
                <nz-option [nzValue]="1" nzLabel="Tiếp nhận thông tin"></nz-option>
                <nz-option [nzValue]="2" nzLabel="Xác minh thông tin"></nz-option>
                <nz-option [nzValue]="3" nzLabel="Chẩn đoán sơ bộ"></nz-option>
                <nz-option [nzValue]="4" nzLabel="Báo giá"></nz-option>
                <nz-option [nzValue]="5" nzLabel="Sửa chữa/Bảo hành"></nz-option>
                <nz-option [nzValue]="6" nzLabel="Hoàn trả"></nz-option>
              </nz-select>
            </div>

            <!-- Date range -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Từ ngày:</label>
              <nz-date-picker class="fs-12 filter-input" nzSize="small" [(ngModel)]="filter.fromDate"></nz-date-picker>
            </div>

            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Đến ngày:</label>
              <nz-date-picker class="fs-12 filter-input" nzSize="small" [(ngModel)]="filter.toDate"></nz-date-picker>
            </div>

            <!-- Email -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Email:</label>
              <input nz-input nzSize="small" class="fs-12 filter-input" [(ngModel)]="filter.email" />
            </div>

            <!-- Phone -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">SĐT:</label>
              <input nz-input nzSize="small" class="fs-12 filter-input" [(ngModel)]="filter.phoneNumber" />
            </div>

            <!-- Claim No -->
            <div class="d-flex gap-1 align-items-center">
              <label class="fs-12 fw-bold mb-0 filter-label">Số phiếu:</label>
              <input nz-input nzSize="small" class="fs-12 filter-input" [(ngModel)]="filter.claimNo" />
            </div>

          </div>

          <!-- Actions -->
          <div class="d-flex gap-2 justify-content-start">
            <button class="btn-apply-filter" nz-button nzType="primary" nzSize="small" (click)="applyFilter()">
              🔍 Lọc</button>
            <button class="btn-reset-filter" nz-button nzType="default" nzSize="small" (click)="resetFilter()">
              ❌ Reset</button>
          </div>

        </div>
      </div>
    </div>

    <div class="tab-container">
      <div class="tabs">
        <div class="tab" [class.active]="currentFilter == 0" data-tab="tab1" (click)="filterStatus(0)">
          <span class="tab-badge">{{dataset.length}}</span> Tất cả
        </div>
        <div class="tab" [class.active]="currentFilter == 1" data-tab="tab1" (click)="filterStatus(1)">
          <span class="tab-badge">{{getStatusCount(1)}}</span> Tiếp nhận thông tin
        </div>
        <div class="tab" [class.active]="currentFilter == 2" data-tab="tab2" (click)="filterStatus(2)">
          <span class="tab-badge">{{getStatusCount(2)}}</span> Xác minh thông tin
        </div>
        <div class="tab" [class.active]="currentFilter == 3" data-tab="tab3" (click)="filterStatus(3)">
          <span class="tab-badge">{{getStatusCount(3)}}</span> Chẩn đoán sơ bộ
        </div>
        <div class="tab" [class.active]="currentFilter == 4" data-tab="tab4" (click)="filterStatus(4)">
          <span class="tab-badge">{{getStatusCount(4)}}</span> Báo giá
        </div>
        <div class="tab" [class.active]="currentFilter == 5" data-tab="tab5" (click)="filterStatus(5)">
          <span class="tab-badge">{{getStatusCount(5)}}</span> Sửa chữa/Bảo hành
        </div>
        <div class="tab" [class.active]="currentFilter == 6" data-tab="tab6" (click)="filterStatus(6)">
          <span class="tab-badge">{{getStatusCount(6)}}</span> Hoàn trả
        </div>
      </div>

      <div id="grid_warranty_container" class="tab-content">
        <angular-slickgrid #asg gridId="grid-warranty" [columns]="columnDefinitions" [options]="gridOptions"
          [dataset]="dataset" (onAngularGridCreated)="angularGridReady($event.detail)" (onDblClick)="openEditModal()">
        </angular-slickgrid>
      </div>
    </div>
  </div>
</ng-container>
