<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0">
    <div class="card-header bg-white p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2">
          <button class="fs-12 btn-add" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small" (click)="openAddModal()">
            <img src="assets/icon/action_add_item_16.png" alt="Thêm " /> Thêm
          </button>
          <button class="fs-12 btn-edit" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small" (click)="openEditModal()">
            <img src="assets/icon/action_edit_item_16.png" alt="Sửa" />Sửa
          </button>
          <button class="fs-12 btn-delete" nz-button nzType="default" nzSize="small" nz-button nzType="default"
            nzSize="small">
            <img src="assets/icon/action_delete_item_16.png" alt="Xóa " />Xóa
          </button>
        </div>
      </div>
    </div>

    <div class="tab-container">
      <div class="tabs">
        <div class="tab" [class.active]="currentFilter == 0" data-tab="tab1" (click)="filterStatus(0)">
          <span class="tab-badge">{{dataset.length}}</span> Tất cả
        </div>
        <div class="tab" [class.active]="currentFilter == 1" data-tab="tab1" (click)="filterStatus(1)">
          <span class="tab-badge">{{getStatusCount(1)}}</span> Tiếp nhận thông tin
        </div>
        <div class="tab" [class.active]="currentFilter == 2" data-tab="tab2" (click)="filterStatus(2)">
          <span class="tab-badge">{{getStatusCount(2)}}</span> Xác minh thông tin
        </div>
        <div class="tab" [class.active]="currentFilter == 3" data-tab="tab3" (click)="filterStatus(3)">
          <span class="tab-badge">{{getStatusCount(3)}}</span> Chẩn đoán sơ bộ
        </div>
        <div class="tab" [class.active]="currentFilter == 4" data-tab="tab4" (click)="filterStatus(4)">
          <span class="tab-badge">{{getStatusCount(4)}}</span> Báo giá
        </div>
        <div class="tab" [class.active]="currentFilter == 5" data-tab="tab5" (click)="filterStatus(5)">
          <span class="tab-badge">{{getStatusCount(5)}}</span> Sửa chữa/Bảo hành
        </div>
        <div class="tab" [class.active]="currentFilter == 6" data-tab="tab6" (click)="filterStatus(6)">
          <span class="tab-badge">{{getStatusCount(6)}}</span> Hoàn trả
        </div>
      </div>

      <div class="tab-content">
        <angular-slickgrid #asg gridId="grid1" [columns]="columnDefinitions" [options]="gridOptions" [dataset]="dataset"
          (onAngularGridCreated)="angularGridReady($event.detail)">
        </angular-slickgrid>
      </div>
    </div>
  </div>
</ng-container>
