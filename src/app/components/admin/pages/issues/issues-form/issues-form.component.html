<div class="modal-body">
  <form nz-form [formGroup]="formGroup" nzLayout="vertical" class="fs-7 mt-2">
    <nz-row [nzGutter]="16">
      <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="12" [nzLg]="12">
      </nz-col>
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="24" [nzLg]="24">
        <nz-form-item>
          <nz-form-label for="unitNameInput" class="form-label p-0"
            >Tên lỗi<span class="text-danger ps-1"
              >(*)
            </span></nz-form-label
          >
          <nz-form-control
            [nzSpan]="24"
            [nzErrorTip]="
              formGroup.get('Name')?.hasError('required') &&
              (formGroup.get('Name')?.dirty || formGroup.get('Name')?.touched)
                ? 'Vui lòng nhập tên lỗi hỏng hóc!'
                : formGroup.get('Name')?.hasError('maxlength')
                ? 'Tên loại tối đa 50 ký tự!'
                : undefined
            "
          >
            <input
              id="unitNameInput"
              nz-input
              name="Name"
              placeholder="Nhập tên lỗi"
              formControlName="Name"
            />
          </nz-form-control>
        </nz-form-item>
      </nz-col>
    </nz-row>
  </form>
  <div class="table-container">
    <div #IssuesTable></div>
  </div>

</div>
  <div class="modal-footer mt-3 gap-3">
      <button nz-button nzDanger nzType="default" (click)="close()">
        Đóng
      </button>
      <button nz-button nzType="primary" (click)="saveIssuesData()">
        Lưu
      </button>
    </div>
